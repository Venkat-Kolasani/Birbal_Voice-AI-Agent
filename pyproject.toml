[project]
name = "birbal"
version = "0.1.0"
description = "Birbal: a voice agent that debriefs problem owners into redacted, builder-ready briefs."
requires-python = ">=3.11"
dependencies = [
    "pipecat-ai[deepgram,google,groq,sarvam,elevenlabs,silero,webrtc,runner]==1.12.0",
    "fastapi",
    "uvicorn",
    "pydantic>=2",
    "python-dotenv",
    "httpx",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["server/tests"]
pythonpath = ["server"]
